# prodCo Workspace - Docker Compose Configuration
#
# LOCAL DEV:  docker compose up db -d
#             npm run db:push
#             npm run dev
#
# PRODUCTION: docker compose up -d  (uncomment the app service below)

# version: '3.8' (obsolete)

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: prodCo-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prodCo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prodCo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-prodCo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d  # SQL files here run on first start
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-prodCo}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # prodCo Workspace Application (uncommented for production/Docker-only deployment)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodCo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prodCo}:${POSTGRES_PASSWORD:-prodCo_secret}@db:5432/${POSTGRES_DB:-prodCo}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-random-secret-in-production}
      PORT: 5000
      NODE_ENV: production
      INSECURE_AUTH: "true"
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
    ports:
      - "8080:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
