# prodCo Workspace - Docker Compose Configuration
#
# LOCAL DEV:  docker compose up db -d
#             npm run db:push
#             npm run dev
#
# PRODUCTION: docker compose up -d  (uncomment the app service below)

# version: '3.8' (obsolete)

services:
  # PostgreSQL Database
  # Firebase Local Emulator
  db:
    image: spine3/firebase-emulator:latest
    container_name: prodCo-firestore-emulator
    restart: unless-stopped
    ports:
      - "8082:8080" # Firestore port
      - "4000:4000" # Emulator suite UI
    environment:
      - GSE_EMULATORS=firestore

  # prodCo Workspace Application (uncommented for production/Docker-only deployment)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: prodCo-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-prodCo}:${POSTGRES_PASSWORD:-prodCo_secret}@db:5432/${POSTGRES_DB:-prodCo}
      SESSION_SECRET: ${SESSION_SECRET:-change-this-to-a-random-secret-in-production}
      PORT: 5000
      NODE_ENV: production
      INSECURE_AUTH: "true"
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    ports:
      - "8080:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgres_data:
    driver: local
